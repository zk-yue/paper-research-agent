[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
version = "0.1.0"
description = "Local academic literature search and evidence-based review workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["literature-review", "research", "arxiv", "openalex", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "python-dotenv>=1,<2",
  "paper-search-mcp==0.1.4",
  "rich>=13,<15",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "anyio>=4,<5",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/zk-yue/paper-research-agent"
Issues = "https://github.com/zk-yue/paper-research-agent/issues"

[project.scripts]
paper-research = "cli:main"
paper-research-server = "backend.server:main"

[tool.setuptools]
include-package-data = false
py-modules = ["cli", "codex_llm", "extract_papers", "graph", "history", "llm", "main", "manage_papers", "paper_config", "settings", "state", "storage", "tools"]

[tool.setuptools.packages.find]
include = ["backend*", "agents*"]
exclude = ["backend.data*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "frontend", "task_data", "history", "runs", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
