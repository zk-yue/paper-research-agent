name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Check publishable source files
        run: python scripts/check_release.py
      - name: Check reachable Git history
        run: python scripts/check_release.py --history
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect wheel and source archive contents
        run: python scripts/check_release.py --archive dist/*.whl dist/*.tar.gz
      - name: Install the wheel outside the source checkout
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install dist/*.whl httpx
      - name: Check installed entry point and API without research data or credentials
        working-directory: ${{ runner.temp }}
        env:
          PAPER_RESEARCH_DATA_DIR: ${{ runner.temp }}/package-smoke-data
        run: |
          "$RUNNER_TEMP/package-smoke/bin/paper-research" --help
          "$RUNNER_TEMP/package-smoke/bin/python" -I - <<'PY'
          import importlib.metadata
          from fastapi.testclient import TestClient
          from backend.app import create_app
          from paper_config import load_config
          from settings import PROJECT_ROOT

          distribution = importlib.metadata.distribution("paper-research-agent")
          assert any(ep.name == "paper-research-server" for ep in distribution.entry_points)
          assert not (PROJECT_ROOT / "pyproject.toml").exists()
          assert load_config()["papers"] == []
          with TestClient(create_app()) as client:
              assert client.get("/api/health").json() == {"status": "ok"}
              assert client.get("/api/tasks").json() == []
          PY
